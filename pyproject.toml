[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vboxwrapper"
version = "0.1.0"
description = ""
authors = [{ name = "l02", email = "l8556@outlook.com" }]
readme = "README.md"
requires-python = ">=3.12"
classifiers=[
    'Operating System :: OS Independent',
    "Programming Language :: Python :: 3 :: Only",
    'Programming Language :: Python :: 3.7',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Programming Language :: Python :: Implementation :: CPython',
]

dependencies = [
    "rich>=15.0.0",
    "vboxapi",
]

[project.urls]
Repository = "https://github.com/l8556/VBoxWrapper.git"

# Exclude vendor/ from the wheel; it is only a path source for the vboxapi dependency.
[tool.setuptools.packages.find]
include = ["vboxwrapper*"]

# The VirtualBox API bindings are not published on PyPI, `vendor/vboxapi` builds them from the
# SDK of the locally installed VirtualBox.
[tool.uv.sources]
vboxapi = { path = "vendor/vboxapi" }
